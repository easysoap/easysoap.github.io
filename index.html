<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문장 만들기 카드 뒤집기 게임</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        }

        body {
            background-color: #f0f3f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            min-height: 100vh;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 2rem;
            text-align: center;
            font-weight: 800;
        }

        .instruction {
            color: #555;
            margin-bottom: 20px;
            font-size: 1.05rem;
            text-align: center;
            font-weight: 500;
        }

        /* 컨트롤 버튼 영역 */
        .control-panel {
            background: #ffffff;
            padding: 16px 28px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background-color: #4a6fa5;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-show-all {
            background-color: #27ae60;
        }

        .btn-show-all:hover {
            background-color: #219150;
        }

        .btn-reset {
            background-color: #7f8c8d;
        }

        .btn-reset:hover {
            background-color: #6c7a7d;
        }

        /* 카드 그리드 레이아웃 (6열 x 6행 = 36개) */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 14px;
            width: 100%;
            max-width: 1200px;
        }

        @media (max-width: 900px) {
            .card-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
        }

        @media (max-width: 600px) {
            .card-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
        }

        /* 3D 카드 뒤집기 효과 */
        .card {
            height: 125px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        /* 카드 뒤집힘 상태 (앞면 보기) */
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            user-select: none;
        }

        /* 뒷면 (숨김/사용완료 상태) */
        .card-back {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            border: 2px solid #5f3dc4;
        }

        .card-back .card-icon {
            font-size: 2rem;
            font-weight: bold;
            line-height: 1;
        }

        .card-back .card-num {
            font-size: 0.85rem;
            margin-top: 6px;
            opacity: 0.9;
            font-weight: 600;
        }

        /* 앞면 (단어 전용 공개 상태) */
        .card-front {
            background-color: #ffffff;
            color: #2c3e50;
            transform: rotateY(180deg);
            border: 3px solid #a29bfe;
            justify-content: center; /* 단어 텍스트 수직 중앙 정렬 */
        }

        /* 단어 텍스트 크기 강조 */
        .word-text {
            font-size: 1.7rem;
            font-weight: 900;
            word-break: keep-all;
            color: #1a252f;
            line-height: 1.2;
            text-align: center;
        }

        /* 반응형 폰트 조절 */
        @media (max-width: 900px) {
            .card {
                height: 115px;
            }
            .word-text {
                font-size: 1.45rem;
            }
        }

        @media (max-width: 600px) {
            .card {
                height: 105px;
            }
            .word-text {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>

    <h1>🧩 문장 만들기 카드 뒤집기</h1>
    <p class="instruction">모든 카드를 연 후, 단어를 조합하여 문장을 만들어 보세요!</p>

    <!-- 상단 컨트롤 버튼 -->
    <div class="control-panel">
        <button class="btn btn-show-all" onclick="showAllCards()">📢 전체 카드 열기 (앞면)</button>
        <button class="btn btn-reset" onclick="resetGame()">🔄 카드 섞기 / 초기화</button>
    </div>

    <!-- 카드 36개 그리드 -->
    <div class="card-grid" id="cardGrid"></div>

    <script>
        // 1. 단어 데이터 (총 36개 단어만 구성)
        const wordList = [
            '내가', '민수가', '강아지가', '선생님이', '고양이가', '친구들이', 
            '동생이', '우리가', '로봇이', '새가', '하늘이', '해가',
            '사과를', '축구공을', '책을', '밥을', '노래를', '자전거를', 
            '그림을', '장난감을', '우유를', '영화를', '옷을', '선물을',
            '먹는다.', '찬다.', '읽는다.', '마신다.', '부른다.', '탄다.', 
            '그린다.', '만든다.', '본다.', '입는다.', '떠오른다.', '맑다.'
        ];

        // 2. 카드 무작위 섞기
        function shuffle(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // 3. 카드 화면 생성 (성분 표시 없이 단어만 출력)
        function createBoard() {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';
            
            const shuffledWords = shuffle(wordList);

            shuffledWords.forEach((wordText, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                
                card.onclick = function() {
                    this.classList.toggle('flipped');
                };

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-back">
                            <span class="card-icon">❓</span>
                            <span class="card-num">${index + 1}</span>
                        </div>
                        <div class="card-front">
                            <span class="word-text">${wordText}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 4. 모든 카드 한번에 앞면으로 열기
        function showAllCards() {
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => card.classList.add('flipped'));
        }

        // 5. 카드 섞기 및 초기화
        function resetGame() {
            createBoard();
        }

        // 페이지 최초 진입 시 보드 생성
        createBoard();
    </script>
</body>
</html>
